name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS Debug
    runs-on: macos-14

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      QT_ROOT: ${{ runner.temp }}/Qt/6.8.3/macos
      VCPKG_MAX_RETRIES: 5
      X_VCPKG_DOWNLOAD_RETRY_DELAY_SECONDS: 10
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"

    steps:
      - name: Checkout PluginBased
        uses: actions/checkout@v4
        with:
          path: PluginBased

      - name: Checkout QtQuickComponents
        uses: actions/checkout@v4
        with:
          repository: Zacus/QtQuickComponents
          path: QtQuickComponents

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          ref: ea1a7396b05637a53bf23c078647ecc0edee4b80
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: python -m pip install --disable-pip-version-check aqtinstall==3.3.0

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt/6.8.3
          key: qt-${{ runner.os }}-6.8.3-clang_64-qtmultimedia-qtshadertools-aqt-3.3.0

      - name: Install Qt 6.8.3
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: aqt install-qt --outputdir "${RUNNER_TEMP}/Qt" mac desktop 6.8.3 clang_64 -m qtmultimedia qtshadertools

      - name: Validate Qt 6.8.3
        run: test -f "${QT_ROOT}/lib/cmake/Qt6/Qt6Config.cmake"

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ~/.vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('PluginBased/vcpkg.json') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('PluginBased/vcpkg.json') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        working-directory: PluginBased
        run: |
          set -o pipefail
          cmake --preset debug 2>&1 | tee configure.log || {
              emit_error_annotation() {
                local file="$1"
                if [ ! -f "${file}" ]; then
                  return 0
                fi

                local excerpt
                excerpt="$(
                  {
                    echo "VCPKG_ROOT=${VCPKG_ROOT}"
                    echo "QT_ROOT=${QT_ROOT}"
                    echo ""
                    echo "### ${file}: matching error context"
                    grep -Ei -C 3 "error|failed|fatal|not found|could not|unable" "${file}" || true
                    echo ""
                    echo "### ${file}: tail"
                    tail -n 80 "${file}"
                  } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n'
                )"
                echo "::error title=Configure diagnostics from ${file}::${excerpt}"
              }

              emit_error_annotation "configure.log"
              emit_error_annotation "build/vcpkg-manifest-install.log"
              emit_error_annotation "build/CMakeFiles/CMakeConfigureLog.yaml"
              emit_error_annotation "build/CMakeFiles/CMakeError.log"

              echo "::group::CMake/vcpkg configure diagnostics"
              {
                echo "## Configure diagnostics"
                echo ""
                echo "### Environment"
                echo '```text'
                echo "VCPKG_ROOT=${VCPKG_ROOT}"
                echo "QT_ROOT=${QT_ROOT}"
                echo '```'
                for log_file in \
                  configure.log \
                  build/vcpkg-manifest-install.log \
                  build/CMakeFiles/CMakeConfigureLog.yaml \
                  build/CMakeFiles/CMakeError.log
                do
                  if [ -f "${log_file}" ]; then
                    echo ""
                    echo "### ${log_file}"
                    echo '```text'
                    cat "${log_file}"
                    echo '```'
                  fi
                done
              } | tee configure-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              exit 1
            }

      - name: Upload configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-diagnostics
          path: |
            PluginBased/configure-diagnostics.md
            PluginBased/configure.log
            PluginBased/build/vcpkg-manifest-install.log
            PluginBased/build/CMakeFiles/CMakeConfigureLog.yaml
            PluginBased/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

      - name: Build
        working-directory: PluginBased
        run: cmake --build --preset debug --parallel

      - name: Test
        working-directory: PluginBased
        run: |
          set -o pipefail
          ctest --preset debug 2>&1 | tee ctest.log || {
            emit_error_annotation() {
              local file="$1"
              if [ ! -f "${file}" ]; then
                return 0
              fi

              local excerpt
              excerpt="$(
                {
                  echo "### ${file}: matching failure context"
                  grep -Ei -C 5 "fail|failed|failure|error|exception|timeout|not run" "${file}" || true
                  echo ""
                  echo "### ${file}: tail"
                  tail -n 120 "${file}"
                } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n'
              )"
              echo "::error title=CTest diagnostics from ${file}::${excerpt}"
            }

            emit_error_annotation "ctest.log"
            emit_error_annotation "build/Testing/Temporary/LastTest.log"
            exit 1
          }

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            PluginBased/ctest.log
            PluginBased/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
