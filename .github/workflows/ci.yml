name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS Debug
    runs-on: macos-14

    env:
      VCPKG_MAX_RETRIES: 5
      X_VCPKG_DOWNLOAD_RETRY_DELAY_SECONDS: 10
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Checkout PluginBased
        uses: actions/checkout@v4
        with:
          path: PluginBased

      - name: Checkout QtQuickComponents
        uses: actions/checkout@v4
        with:
          repository: Zacus/QtQuickComponents
          path: QtQuickComponents

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          ref: ea1a7396b05637a53bf23c078647ecc0edee4b80
          fetch-depth: 0

      - name: Install Qt
        run: |
          brew install qt || true
          brew link --overwrite --force qt || true

          detect_qt6_dir() {
            local prefix="$1"
            if [ ! -d "${prefix}" ]; then
              return 0
            fi

            local config_file
            config_file="$(find -L "${prefix}" -name Qt6Config.cmake -print -quit || true)"
            if [ -n "${config_file}" ]; then
              dirname "${config_file}"
            fi
          }

          QT_PREFIX="$(brew --prefix qt)"
          QT6_CMAKE_DIR=""

          for candidate in \
            "${QT_PREFIX}" \
            "$(brew --cellar qt)/$(brew list --versions qt | awk '{print $NF}')"
          do
            detected_dir="$(detect_qt6_dir "${candidate}")"
            if [ -n "${detected_dir}" ]; then
              QT_PREFIX="${candidate}"
              QT6_CMAKE_DIR="${detected_dir}"
              break
            fi
          done

          if [ -z "${QT6_CMAKE_DIR}" ]; then
            echo "::warning title=Qt reinstall::Homebrew reports qt installed, but Qt6Config.cmake was not found. Reinstalling qt."
            brew reinstall qt
            brew link --overwrite --force qt || true

            QT_PREFIX="$(brew --prefix qt)"
            QT6_CMAKE_DIR="$(detect_qt6_dir "${QT_PREFIX}")"
          fi

          if [ -z "${QT6_CMAKE_DIR}" ]; then
            echo "::error title=Qt detection failed::Could not find Qt6Config.cmake after brew install/reinstall qt."
            brew list --versions qt || true
            find -L "$(brew --cellar qt)" -name Qt6Config.cmake -print || true
            exit 1
          fi

          echo "CMAKE_PREFIX_PATH=${QT_PREFIX}" >> "$GITHUB_ENV"
          echo "Qt6_DIR=${QT6_CMAKE_DIR}" >> "$GITHUB_ENV"
          echo "Qt prefix: ${QT_PREFIX}"
          echo "Detected Qt6_DIR: ${QT6_CMAKE_DIR}"
          find -L "${QT_PREFIX}" -name Qt6Config.cmake -print || true

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ~/.vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('PluginBased/vcpkg.json') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('PluginBased/vcpkg.json') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        working-directory: PluginBased
        run: |
          set -o pipefail
          qt_args=()
          if [ -n "${Qt6_DIR:-}" ]; then
            qt_args+=("-DQt6_DIR=${Qt6_DIR}")
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            "${qt_args[@]}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            2>&1 | tee configure.log || {
              emit_error_annotation() {
                local file="$1"
                if [ ! -f "${file}" ]; then
                  return 0
                fi

                local excerpt
                excerpt="$(
                  {
                    echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
                    echo "Qt6_DIR=${Qt6_DIR:-}"
                    echo ""
                    echo "### ${file}: matching error context"
                    grep -Ei -C 3 "error|failed|fatal|not found|could not|unable" "${file}" || true
                    echo ""
                    echo "### ${file}: tail"
                    tail -n 80 "${file}"
                  } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n'
                )"
                echo "::error title=Configure diagnostics from ${file}::${excerpt}"
              }

              emit_error_annotation "configure.log"
              emit_error_annotation "build/vcpkg-manifest-install.log"
              emit_error_annotation "build/CMakeFiles/CMakeConfigureLog.yaml"
              emit_error_annotation "build/CMakeFiles/CMakeError.log"

              echo "::group::CMake/vcpkg configure diagnostics"
              {
                echo "## Configure diagnostics"
                echo ""
                echo "### Environment"
                echo '```text'
                echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
                echo "Qt6_DIR=${Qt6_DIR:-}"
                echo '```'
                for log_file in \
                  configure.log \
                  build/vcpkg-manifest-install.log \
                  build/CMakeFiles/CMakeConfigureLog.yaml \
                  build/CMakeFiles/CMakeError.log
                do
                  if [ -f "${log_file}" ]; then
                    echo ""
                    echo "### ${log_file}"
                    echo '```text'
                    cat "${log_file}"
                    echo '```'
                  fi
                done
              } | tee configure-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              exit 1
            }

      - name: Upload configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-diagnostics
          path: |
            PluginBased/configure-diagnostics.md
            PluginBased/configure.log
            PluginBased/build/vcpkg-manifest-install.log
            PluginBased/build/CMakeFiles/CMakeConfigureLog.yaml
            PluginBased/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

      - name: Build
        working-directory: PluginBased
        run: cmake --build build --parallel

      - name: Test
        working-directory: PluginBased
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || {
            emit_error_annotation() {
              local file="$1"
              if [ ! -f "${file}" ]; then
                return 0
              fi

              local excerpt
              excerpt="$(
                {
                  echo "### ${file}: matching failure context"
                  grep -Ei -C 5 "fail|failed|failure|error|exception|timeout|not run" "${file}" || true
                  echo ""
                  echo "### ${file}: tail"
                  tail -n 120 "${file}"
                } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n'
              )"
              echo "::error title=CTest diagnostics from ${file}::${excerpt}"
            }

            emit_error_annotation "ctest.log"
            emit_error_annotation "build/Testing/Temporary/LastTest.log"
            exit 1
          }

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            PluginBased/ctest.log
            PluginBased/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
