name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS Debug
    runs-on: macos-14

    env:
      VCPKG_MAX_RETRIES: 5
      X_VCPKG_DOWNLOAD_RETRY_DELAY_SECONDS: 10
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      HOMEBREW_NO_AUTO_UPDATE: 1
      VCPKG_COMMIT: 4b3e4c276b5b87a649e66341e11553e8c577459c

    steps:
      - name: Checkout PluginBased
        uses: actions/checkout@v4
        with:
          path: PluginBased

      - name: Checkout QtQuickComponents
        uses: actions/checkout@v4
        with:
          repository: Zacus/QtQuickComponents
          path: QtQuickComponents

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg

      - name: Cache Homebrew Qt
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/qt
          key: brew-qt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: brew-qt-${{ runner.os }}-

      - name: Install Qt
        run: |
          # 缓存命中时跳过下载，但始终重建软链接
          brew install qt || true
          brew link --overwrite --force qt
          QT_PREFIX="$(brew --prefix qt)"
          QT6_CMAKE_DIR="$(find "${QT_PREFIX}" -path "*/lib/cmake/Qt6" -type d -print -quit || true)"
          echo "CMAKE_PREFIX_PATH=${QT_PREFIX}" >> "$GITHUB_ENV"
          if [ -n "${QT6_CMAKE_DIR}" ]; then
            echo "Qt6_DIR=${QT6_CMAKE_DIR}" >> "$GITHUB_ENV"
          fi
          echo "Qt prefix: ${QT_PREFIX}"
          echo "Detected Qt6_DIR: ${QT6_CMAKE_DIR:-not found}"
          find "${QT_PREFIX}" -maxdepth 5 -type d -path "*/cmake/Qt6" -print || true

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ~/.vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('PluginBased/vcpkg.json') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('PluginBased/vcpkg.json') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        working-directory: PluginBased
        run: |
          qt_args=()
          if [ -n "${Qt6_DIR:-}" ]; then
            qt_args+=("-DQt6_DIR=${Qt6_DIR}")
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            "${qt_args[@]}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" || {
              echo "::group::CMake/vcpkg configure diagnostics"
              {
                echo "## Configure diagnostics"
                echo ""
                echo "### Environment"
                echo '```text'
                echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
                echo "Qt6_DIR=${Qt6_DIR:-}"
                echo '```'
                for log_file in \
                  build/vcpkg-manifest-install.log \
                  build/CMakeFiles/CMakeConfigureLog.yaml \
                  build/CMakeFiles/CMakeError.log
                do
                  if [ -f "${log_file}" ]; then
                    echo ""
                    echo "### ${log_file}"
                    echo '```text'
                    cat "${log_file}"
                    echo '```'
                  fi
                done
              } | tee configure-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              exit 1
            }

      - name: Upload configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-diagnostics
          path: |
            PluginBased/configure-diagnostics.md
            PluginBased/build/vcpkg-manifest-install.log
            PluginBased/build/CMakeFiles/CMakeConfigureLog.yaml
            PluginBased/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

      - name: Build
        working-directory: PluginBased
        run: cmake --build build --parallel

      - name: Test
        working-directory: PluginBased
        run: ctest --test-dir build --output-on-failure
