# =============================================================================
# PluginBased 打包配置
# 由 tools/deploy.py 读取，可随项目独立维护
# =============================================================================

app:
  name: PluginBased
  binary: PluginBasedApp
  bundle_id: com.pluginbased.app

# QML 模块：构建目录下的子目录名，整目录打入发布包
# main.cpp 的 addImportPath 会在运行时找到这些目录
qml_modules:
  - AppLog
  - PluginBased
  - PlayPlugin
  - QuickUI

# Qt 运行时插件白名单
# macdeployqt 静态扫描会漏掉这些通过 dlopen / QPluginLoader 加载的库
# 路径相对于 Qt 安装目录（Qt6_DIR/../../../）
qt_runtime_plugins:
  macos:
    # QML 引擎运行时插件（import 时按需加载，静态扫描不可见）
    qml:
      - qml/Qt/labs/folderlistmodel
    # 平台插件
    platforms:
      - plugins/platforms/libqcocoa.dylib
    # 平台主题
    styles:
      - plugins/styles/libqmacstyle.dylib
    # 图片格式
    imageformats:
      - plugins/imageformats/libqjpeg.dylib
    # 多媒体后端
    multimedia:
      - plugins/multimedia/libdarwinmediaplugin.dylib
    # 无障碍
    accessibility:
      - plugins/accessible/libqtaccessiblequick.dylib
    frameworks:
      - frameworks/QtDBus.framework
      - ../dbus/lib/libdbus-1.3.dylib

  linux:
    qml:
      - qml/Qt/labs/folderlistmodel
      - qml/Qt/labs/settings
      - qml/QtQml
      - qml/QtQml/Models
      - qml/QtQml/WorkerScript
      - qml/QtQuick
      - qml/QtQuick/Controls
      - qml/QtQuick/Controls/Basic
      - qml/QtQuick/Dialogs
      - qml/QtQuick/Layouts
      - qml/QtQuick/Window
      - qml/QtMultimedia
    platforms:
      - plugins/platforms/libqxcb.so
      - plugins/platforms/libqwayland-generic.so
      - plugins/xcbglintegrations/libqxcb-glx-integration.so
    imageformats:
      - plugins/imageformats/libqjpeg.so
      - plugins/imageformats/libqsvg.so
    multimedia:
      - plugins/multimedia/libgstreamermediaplugin.so
    platformthemes:
      - plugins/platformthemes/libqgtk3.so

  windows:
    qml:
      - qml/Qt/labs/folderlistmodel
      - qml/Qt/labs/settings
      - qml/QtQml
      - qml/QtQml/Models
      - qml/QtQml/WorkerScript
      - qml/QtQuick
      - qml/QtQuick/Controls
      - qml/QtQuick/Controls/Basic
      - qml/QtQuick/Dialogs
      - qml/QtQuick/Layouts
      - qml/QtQuick/Window
      - qml/QtMultimedia
    platforms:
      - plugins/platforms/qwindows.dll
    imageformats:
      - plugins/imageformats/qjpeg.dll
      - plugins/imageformats/qsvg.dll
    multimedia:
      - plugins/multimedia/windowsmediaplugin.dll
    styles:
      - plugins/styles/qwindowsvistastyle.dll

# 发布包结构定义
layout:
  macos:
    plugins: Contents/PlugIns          # initPlugins 搜索路径
    qml: Contents/Resources/qml        # main.cpp addImportPath 路径
    qt_plugins: Contents/PlugIns       # Qt 运行时插件（与业务插件同目录，Qt 约定）
    frameworks: Contents/Frameworks    # macdeployqt 管理
  linux:
    bin: bin
    plugins: bin/plugins               # initPlugins 搜索路径（appDir + "/plugins"）
    qml: bin/qml                       # main.cpp addImportPath 路径（appDir + "/qml"）
    lib: lib
  windows:
    root: .                            # .exe 同级
    plugins: plugins                   # initPlugins 搜索路径
    qml: qml                           # main.cpp addImportPath 路径
